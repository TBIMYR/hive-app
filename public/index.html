<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<style>
  :root {
    --bg: #f4f5f7; --fg: #16181d; --muted: #6b7280; --faint: #9ca3af;
    --card: #ffffff; --line: #e3e5e9; --chip: #eceef2;
    --need: #dc2626; --need-bg: #fef2f2;
    --block: #d97706; --block-bg: #fffbeb;
    --busy: #16a34a; --busy-bg: #f0fdf4;
    --idle: #9ca3af; --shell: #2563eb; --offline: #b6bac2;
    --accent: #2563eb;
    --sat: 55%; --lig: 48%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --fg: #e6e8eb; --muted: #9aa1ab; --faint: #6b7280;
      --card: #171a20; --line: #262a33; --chip: #20242c;
      --need: #f87171; --need-bg: #2a1414;
      --block: #fbbf24; --block-bg: #2a2110;
      --busy: #4ade80; --busy-bg: #11241a;
      --idle: #6b7280; --shell: #60a5fa; --offline: #4b5563;
      --accent: #60a5fa;
      --sat: 60%; --lig: 62%;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* Kopf + Filter */
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 15px; margin: 0; }
  .counts { display: flex; gap: 12px; color: var(--muted); }
  .counts b { color: var(--fg); font-weight: 600; }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .meta .err { color: var(--need); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .filters input[type=search] { font: inherit; padding: 4px 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--card); color: var(--fg); width: 200px; }
  .chipbtn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--card);
         color: var(--muted); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .chipbtn.on { color: var(--fg); border-color: var(--fg); }
  .chipbtn .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }

  /* Bereiche */
  main { display: grid; grid-template-columns: 1fr; }
  main.with-side { grid-template-columns: 1fr minmax(340px, 38%); }
  #board { padding: 4px 16px 60px; min-width: 0; }
  section h2 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  section h2 .n { font-weight: 400; }
  section.need h2 { color: var(--need); }
  section h2 button { all: unset; cursor: pointer; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }

  /* Kachel */
  .tile { position: relative; background: var(--card); border: 1px solid var(--line);
          border-left: 4px solid var(--proj); border-radius: 8px; padding: 10px 12px 10px 12px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: pointer; }
  .tile:hover { border-color: var(--faint); border-left-color: var(--proj); }
  .tile.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tile.k-need { background: var(--need-bg); border-color: color-mix(in srgb, var(--need) 45%, var(--line)); border-left-color: var(--proj); }
  .tile.k-block { background: var(--block-bg); border-color: color-mix(in srgb, var(--block) 45%, var(--line)); border-left-color: var(--proj); }
  .tile.k-off { opacity: .6; }
  .row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name { font-weight: 650; font-size: 14px; }
  .proj { font-size: 11px; color: var(--proj); font-weight: 600; }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--chip); color: var(--muted); font-weight: 600; }
  .tag.bg { background: var(--block); color: #fff; }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
          font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
          color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .pill.pulse .dot { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .why { font-size: 12px; font-weight: 600; color: var(--c); }
  .task { font-size: 13px; overflow-wrap: anywhere; }
  .task .st { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-right: 6px; color: var(--muted); }
  .task.none { color: var(--faint); font-style: italic; }
  .last { color: var(--muted); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .last.open { -webkit-line-clamp: unset; color: var(--fg); }
  .foot { display: flex; gap: 10px; font-size: 11px; color: var(--faint); min-width: 0; }
  .foot .br { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot .age { margin-left: auto; white-space: nowrap; }
  .errors { color: var(--need); font-size: 11px; }
  .empty { color: var(--muted); padding: 40px 0; }

  /* Seitenleiste */
  aside { border-left: 1px solid var(--line); background: var(--card); padding: 12px 18px 40px;
          position: sticky; top: var(--hh, 90px); height: calc(100vh - var(--hh, 90px)); overflow: auto; min-width: 0; }
  aside .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  aside .head button { all: unset; cursor: pointer; color: var(--accent); }
  aside h1, aside h2, aside h3 { font-size: 13px; margin: 14px 0 4px; }
  aside h1 { font-size: 15px; }
  aside pre { background: var(--bg); padding: 8px; overflow: auto; border-radius: 4px; font-size: 12px; }
  aside code { background: var(--bg); padding: 0 3px; border-radius: 3px; font-size: 12px; }
  aside ul, aside ol { padding-left: 20px; }
  aside p, aside li { overflow-wrap: anywhere; }
  aside .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  aside .lastfull { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; font-size: 12px; }

  @media (max-width: 800px) {
    main.with-side { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>Sessions</h1>
    <div class="counts" id="counts"></div>
    <div class="meta" id="meta">…</div>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main">
  <div id="board"><div class="empty">Lade…</div></div>
  <aside id="side" hidden></aside>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- Filterzustand (pro Browser gemerkt) ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('hive-filter')) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem('hive-filter', JSON.stringify(v)); } catch {} },
  };
  const f = Object.assign({ hidden: [], q: '', offline: false, onlyNeed: false }, store.get());
  const save = () => store.set(f);

  let state = null, lastJson = '', selected = null;
  const expanded = new Set();

  // ---------- Einordnung ----------
  // Rang 0 = braucht dich, 1 = arbeitet, 2 = bereit, 3 = offline
  function classify(s) {
    if (s.status === 'offline') return { rank: 3, kind: 'off', label: 'offline', c: 'var(--offline)' };
    if (s.status === 'waiting') return { rank: 0, kind: 'need', label: 'wartet auf dich', c: 'var(--need)', why: s.waitingFor || 'Eingabe nötig' };
    if (s.task && s.task.state === 'blocked') return { rank: 0, kind: 'block', label: 'blockiert', c: 'var(--block)', why: 'Blockiert' };
    if (s.task && s.task.stale) return { rank: 0, kind: 'block', label: 'arbeitet', c: 'var(--block)', why: 'Seit über 60 min keine Meldung', pulse: true };
    if (s.status === 'busy') return { rank: 1, kind: 'busy', label: 'arbeitet', c: 'var(--busy)', pulse: true };
    if (s.status === 'shell') return { rank: 2, kind: 'idle', label: 'Shell', c: 'var(--shell)' };
    return { rank: 2, kind: 'idle', label: 'bereit', c: 'var(--idle)' };
  }
  const SECTIONS = [
    { rank: 0, key: 'need', title: 'Braucht dich' },
    { rank: 1, key: 'busy', title: 'Arbeitet' },
    { rank: 2, key: 'idle', title: 'Bereit' },
    { rank: 3, key: 'off', title: 'Offline' },
  ];

  // Projektfarbe stabil aus dem Gruppenschlüssel. Feste Palette ohne Rot, Orange
  // und Grün, damit Projektfarben nie mit den Statusfarben verwechselt werden.
  // Vergabe der Reihe nach über die alphabetisch sortierten Gruppen, damit
  // benachbarte Projekte nie denselben Ton bekommen.
  const PALETTE = [215, 320, 175, 275, 195, 245, 300, 230];
  let colorIndex = new Map();
  const projColor = key => `hsl(${PALETTE[(colorIndex.get(key) ?? 0) % PALETTE.length]} var(--sat) var(--lig))`;

  function groupLabels(sessions) {
    const m = new Map();
    for (const s of sessions) {
      if (!m.has(s.group)) m.set(s.group, s.project || s.group);
      if (s.isPm && s.project) m.set(s.group, s.project);
    }
    return m;
  }

  function age(iso, now) {
    if (!iso) return '';
    const s = Math.max(0, (now - Date.parse(iso)) / 1000);
    if (s < 60) return 'gerade';
    if (s < 3600) return `${Math.round(s / 60)} min`;
    if (s < 86400) return `${Math.round(s / 3600)} h`;
    return `${Math.round(s / 86400)} d`;
  }

  // ---------- Rendern ----------
  function tile(s, labels, now) {
    const k = classify(s);
    const lbl = labels.get(s.group) || s.group;
    const task = s.task
      ? `<div class="task"><span class="st">${esc(s.task.state || '')}</span>${esc(s.task.text)}</div>`
      : `<div class="task none">keine Aufgaben-Zeile</div>`;
    const lastText = s.lastAssistant ? s.lastAssistant.text : (s.alive ? 'keine Antwort im Fenster' : '');
    const last = lastText ? `<div class="last${expanded.has(s.name) ? ' open' : ''}" data-expand="${esc(s.name)}">${esc(lastText)}</div>` : '';
    const errs = s.errors && s.errors.length ? `<div class="errors">${esc(s.errors.join(' · '))}</div>` : '';
    const when = age(s.lastAssistant?.at || s.statusUpdatedAt || s.task?.updatedAt, now);
    return `<div class="tile k-${k.kind}${selected === s.name ? ' sel' : ''}" style="--proj:${projColor(s.group)};--c:${k.c}" data-open="${esc(s.name)}">
      <div class="row1">
        <span class="name mono">${esc(s.name)}</span>
        ${s.isPm ? '<span class="tag">PM</span>' : ''}
        ${s.kind === 'bg' ? `<span class="tag bg" title="Hintergrund-Session ohne Fenster, PID ${esc(s.pid)}">bg</span>` : ''}
        <span class="proj">${esc(lbl)}</span>
        <span class="pill${k.pulse ? ' pulse' : ''}"><span class="dot"></span>${esc(k.label)}</span>
      </div>
      ${k.why ? `<div class="why">${esc(k.why)}</div>` : ''}
      ${task}
      ${last}
      <div class="foot mono"><span class="br">${esc(s.branch || '')}</span><span class="age">${when}</span></div>
      ${errs}
    </div>`;
  }

  function visible(s) {
    if (f.hidden.includes(s.group)) return false;
    if (s.status === 'offline' && !f.offline) return false;
    if (f.onlyNeed && classify(s).rank !== 0) return false;
    if (f.q) {
      const hay = [s.name, s.project, s.task?.text, s.lastAssistant?.text, s.branch].join(' ').toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }

  function renderFilters(labels, sessions) {
    const counts = new Map();
    for (const s of sessions) counts.set(s.group, (counts.get(s.group) || 0) + 1);
    const chips = [...labels].sort((a, b) => a[1].localeCompare(b[1])).map(([key, lbl]) =>
      `<button class="chipbtn${f.hidden.includes(key) ? '' : ' on'}" data-proj="${esc(key)}">
         <span class="sw" style="background:${projColor(key)}"></span>${esc(lbl)} <span style="color:var(--faint)">${counts.get(key) || 0}</span></button>`).join('');
    const active = document.activeElement && document.activeElement.id === 'q';
    const pos = active ? document.activeElement.selectionStart : null;
    $('#filters').innerHTML =
      `<input id="q" type="search" placeholder="Suchen (/)" value="${esc(f.q)}">
       <span class="sep"></span>${chips}<span class="sep"></span>
       <button class="chipbtn${f.onlyNeed ? ' on' : ''}" data-toggle="onlyNeed">nur „Braucht dich“</button>
       <button class="chipbtn${f.offline ? ' on' : ''}" data-toggle="offline">offline zeigen</button>
       ${f.hidden.length || f.q || f.onlyNeed ? '<button class="chipbtn" data-reset>zurücksetzen</button>' : ''}`;
    if (active) { const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  }

  function render() {
    if (!state) return;
    const now = Date.now();
    const labels = groupLabels(state.sessions);
    colorIndex = new Map([...labels.keys()].sort().map((k, i) => [k, i]));
    renderFilters(labels, state.sessions);

    const all = state.sessions.map(s => ({ s, k: classify(s) }));
    const shown = all.filter(x => visible(x.s));

    let html = '';
    for (const sec of SECTIONS) {
      const items = shown.filter(x => x.k.rank === sec.rank);
      if (!items.length) continue;
      items.sort((a, b) => sec.rank === 0
        // Wer am längsten wartet, zuerst
        ? (Date.parse(a.s.statusUpdatedAt || 0) - Date.parse(b.s.statusUpdatedAt || 0))
        : ((labels.get(a.s.group) || '').localeCompare(labels.get(b.s.group) || '') || (b.s.isPm - a.s.isPm) || a.s.name.localeCompare(b.s.name)));
      html += `<section class="${sec.key}"><h2>${sec.title} <span class="n">${items.length}</span></h2>
        <div class="grid">${items.map(x => tile(x.s, labels, now)).join('')}</div></section>`;
    }
    const hiddenCount = all.length - shown.length;
    if (!html) html = '<div class="empty">Keine Session passt zum Filter.</div>';
    if (hiddenCount) html += `<div class="empty" style="padding:16px 0">${hiddenCount} ausgeblendet</div>`;
    $('#board').innerHTML = html;

    const need = all.filter(x => x.k.rank === 0).length;
    const busy = all.filter(x => x.k.rank === 1).length;
    const idle = all.filter(x => x.k.rank === 2).length;
    $('#counts').innerHTML =
      `<span style="color:var(--need)"><b style="color:inherit">${need}</b> braucht dich</span>
       <span><b>${busy}</b> arbeitet</span><span><b>${idle}</b> bereit</span>`;
    document.title = need ? `(${need}) Sessions` : 'Sessions';
    const errs = state.errors && state.errors.length ? ` · <span class="err">${state.errors.length} Register-Fehler</span>` : '';
    $('#meta').innerHTML = `${new Date(state.generatedAt).toLocaleTimeString('de-DE')}${errs}`;
    document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px');
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const text = await res.text();
      if (text !== lastJson) { lastJson = text; state = JSON.parse(text); render(); }
    } catch {
      $('#meta').innerHTML = '<span class="err">Server nicht erreichbar</span>';
    }
  }

  // ---------- Seitenleiste ----------
  function md(src) {
    const lines = src.split('\n');
    let out = '', inCode = false, list = null, fm = lines[0] === '---';
    const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
    const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (let i = fm ? 1 : 0; i < lines.length; i++) {
      const raw = lines[i];
      if (fm) { if (raw === '---') fm = false; continue; }   // Frontmatter steht schon oben
      if (raw.startsWith('```')) { closeList(); inCode = !inCode; out += inCode ? '<pre>' : '</pre>'; continue; }
      if (inCode) { out += esc(raw) + '\n'; continue; }
      const h = /^(#{1,3})\s+(.*)$/.exec(raw);
      if (h) { closeList(); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
      const ul = /^\s*[-*]\s+(.*)$/.exec(raw), ol = /^\s*\d+[.)]\s+(.*)$/.exec(raw);
      if (ul || ol) {
        const tag = ul ? 'ul' : 'ol';
        if (list !== tag) { closeList(); list = tag; out += `<${tag}>`; }
        out += `<li>${inline((ul || ol)[1])}</li>`; continue;
      }
      if (!raw.trim()) { closeList(); continue; }
      closeList(); out += `<p>${inline(raw)}</p>`;
    }
    closeList();
    return out;
  }

  async function openSide(name) {
    selected = name;
    const s = state && state.sessions.find(x => x.name === name);
    const side = $('#side');
    side.hidden = false;
    $('#main').classList.add('with-side');
    const head = `<div class="head"><b class="mono" style="font-size:15px">${esc(name)}</b><button data-close>schließen ✕</button></div>`;
    const sub = s ? `<div class="sub">${esc(s.cwd || s.project || '')}${s.pid ? ` · PID ${esc(s.pid)}` : ''}</div>` : '';
    const lastUser = s && s.lastUser ? `<h3>Letzter Prompt</h3><div class="lastfull">${esc(s.lastUser.text)}</div>` : '';
    const lastA = s && s.lastAssistant ? `<h3>Letzte Antwort</h3><div class="lastfull">${esc(s.lastAssistant.text)}</div>` : '';
    side.innerHTML = `${head}${sub}${lastUser}${lastA}<h3>Handover</h3><div class="empty" style="padding:8px 0">Lade…</div>`;
    render();
    let ho = '<div class="empty" style="padding:8px 0">Kein Handover.</div>';
    if (s && s.hasHandover) {
      try {
        const res = await fetch(`/api/handover/${encodeURIComponent(name)}`, { cache: 'no-store' });
        if (res.ok) ho = md(await res.text());
      } catch {}
    }
    if (selected === name) side.innerHTML = `${head}${sub}${lastUser}${lastA}<h3>Handover</h3>${ho}`;
  }
  function closeSide() { selected = null; $('#side').hidden = true; $('#main').classList.remove('with-side'); render(); }

  // ---------- Ereignisse ----------
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-close]')) return closeSide();
    const p = t.closest('[data-proj]');
    if (p) {
      const k = p.dataset.proj;
      if (e.altKey) {  // Alt-Klick: nur dieses Projekt
        const keys = [...groupLabels(state.sessions).keys()];
        f.hidden = f.hidden.length === keys.length - 1 && !f.hidden.includes(k) ? [] : keys.filter(x => x !== k);
      } else {
        f.hidden = f.hidden.includes(k) ? f.hidden.filter(x => x !== k) : [...f.hidden, k];
      }
      save(); return render();
    }
    const tg = t.closest('[data-toggle]');
    if (tg) { f[tg.dataset.toggle] = !f[tg.dataset.toggle]; save(); return render(); }
    if (t.closest('[data-reset]')) { f.hidden = []; f.q = ''; f.onlyNeed = false; save(); return render(); }
    const ex = t.closest('[data-expand]');
    if (ex && e.detail === 2) return;  // Doppelklick ignorieren
    if (ex && window.getSelection().toString() === '') {
      const n = ex.dataset.expand;
      expanded.has(n) ? expanded.delete(n) : expanded.add(n);
      ex.classList.toggle('open');
      return;
    }
    const tile = t.closest('[data-open]');
    if (tile) return selected === tile.dataset.open ? closeSide() : openSide(tile.dataset.open);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { f.q = e.target.value; save(); render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.id !== 'q') { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape') { if (document.activeElement.id === 'q') document.activeElement.blur(); else if (selected) closeSide(); }
  });

  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
