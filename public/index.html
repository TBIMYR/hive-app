<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #1a1d21; --muted: #6b7280; --card: #fff; --line: #e5e7eb;
    --busy: #16a34a; --waiting: #d97706; --idle: #9ca3af; --shell: #2563eb; --offline: #9ca3af;
    --stale-bg: #fee2e2; --stale-fg: #991b1b; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --card: #171a21; --line: #262b35;
            --stale-bg: #3b1212; --stale-fg: #fca5a5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  header h1 { font-size: 14px; margin: 0; }
  header .counts span { margin-right: 10px; }
  header .meta { margin-left: auto; color: var(--muted); }
  header .err { color: var(--stale-fg); }
  main { display: grid; grid-template-columns: 1fr; }
  main.with-side { grid-template-columns: 1fr minmax(320px, 40%); }
  #groups { padding: 8px 16px 40px; min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 18px 0 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 6px; overflow: hidden; table-layout: fixed; }
  td { padding: 6px 8px; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  tr:first-child td { border-top: 0; }
  td.name { width: 110px; white-space: nowrap; }
  td.name button { all: unset; cursor: pointer; font-weight: 600; color: var(--accent); }
  td.name button:disabled { cursor: default; color: var(--fg); }
  td.name .pm { color: var(--muted); font-weight: 400; margin-left: 4px; }
  td.name .bg { font-size: 10px; padding: 0 4px; border-radius: 3px; margin-left: 4px;
                background: var(--waiting); color: #fff; font-weight: 600; }
  td.status { width: 150px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
         vertical-align: middle; background: var(--idle); }
  .dot.busy { background: var(--busy); animation: pulse 1.4s infinite; }
  .dot.waiting { background: var(--waiting); }
  .dot.shell { background: var(--shell); }
  .dot.offline { background: transparent; border: 1.5px solid var(--offline); }
  @keyframes pulse { 50% { opacity: .35; } }
  .offline td.name button { text-decoration: line-through; color: var(--muted); }
  td.task { width: 34%; }
  td.task.stale { background: var(--stale-bg); color: var(--stale-fg); }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line);
           color: var(--muted); margin-right: 6px; }
  .age { color: var(--muted); font-size: 11px; margin-left: 6px; }
  td.last { color: var(--muted); }
  td.last .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                 overflow: hidden; cursor: pointer; white-space: pre-wrap; }
  td.last .txt.open { -webkit-line-clamp: unset; color: var(--fg); }
  td.last .branch { font-size: 11px; margin-bottom: 2px; }
  td.last .waiting { color: var(--waiting); }
  td.last .errors { color: var(--stale-fg); font-size: 11px; }
  aside { border-left: 1px solid var(--line); background: var(--card); padding: 12px 16px 40px;
          position: sticky; top: 41px; height: calc(100vh - 41px); overflow: auto; min-width: 0; }
  aside .head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  aside button { all: unset; cursor: pointer; color: var(--accent); }
  aside h1, aside h2, aside h3 { font-size: 13px; text-transform: none; letter-spacing: 0; margin: 14px 0 4px; color: var(--fg); }
  aside h1 { font-size: 14px; }
  aside pre { background: var(--bg); padding: 8px; overflow: auto; border-radius: 4px; }
  aside code { background: var(--bg); padding: 0 3px; border-radius: 3px; }
  aside ul, aside ol { padding-left: 20px; }
  aside p, aside li { white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 40px 16px; }
</style>
</head>
<body>
<header>
  <h1>Sessions</h1>
  <div class="counts" id="counts"></div>
  <div class="meta" id="meta">…</div>
</header>
<main id="main">
  <div id="groups"><div class="empty">Lade…</div></div>
  <aside id="side" hidden></aside>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let lastJson = '';
  const expanded = new Set();

  function age(iso, now) {
    if (!iso) return '';
    const s = Math.max(0, (now - Date.parse(iso)) / 1000);
    if (s < 60) return 'gerade eben';
    if (s < 3600) return `vor ${Math.round(s / 60)} min`;
    if (s < 86400) return `vor ${Math.round(s / 3600)} h`;
    return `vor ${Math.round(s / 86400)} d`;
  }

  function row(s, now) {
    const stale = s.task && s.task.stale;
    const wait = s.waitingFor ? `<div class="waiting">${esc(s.waitingFor)}</div>` : '';
    const task = s.task
      ? `<span class="badge">${esc(s.task.state || '?')}</span>${esc(s.task.text)}<span class="age">${age(s.task.updatedAt, now)}</span>`
      : `<span class="age">keine Aufgaben-Zeile</span>`;
    const txt = s.lastAssistant ? s.lastAssistant.text : (s.alive ? 'keine Antwort im Fenster' : '');
    const last = s.alive
      ? `<div class="branch">${esc(s.branch || '')}${s.lastAssistant ? ` · ${age(s.lastAssistant.at, now)}` : ''}</div>
         <div class="txt${expanded.has(s.name) ? ' open' : ''}" data-name="${esc(s.name)}">${esc(txt)}</div>`
      : `<div class="branch">offline</div>`;
    const errs = s.errors && s.errors.length ? `<div class="errors">${esc(s.errors.join(' · '))}</div>` : '';
    return `<tr class="${esc(s.status)}">
      <td class="name"><button data-open="${esc(s.name)}"${s.hasHandover ? '' : ' disabled title="kein Handover"'}>${esc(s.name)}</button>${s.isPm ? '<span class="pm">PM</span>' : ''}${s.kind === 'bg' ? '<span class="bg" title="Hintergrund-Session ohne Fenster, PID ' + esc(s.pid) + '">bg</span>' : ''}</td>
      <td class="status"><span class="dot ${esc(s.status)}"></span>${esc(s.status)}<span class="age">${age(s.statusUpdatedAt, now)}</span></td>
      <td class="task${stale ? ' stale' : ''}">${task}</td>
      <td class="last">${wait}${last}${errs}</td>
    </tr>`;
  }

  function render(state) {
    const now = Date.now();
    const groups = new Map();
    for (const s of state.sessions) {
      if (!groups.has(s.group)) groups.set(s.group, { label: s.project || s.group, rows: [] });
      const g = groups.get(s.group);
      if (s.isPm && s.project) g.label = s.project;
      g.rows.push(s);
    }
    let html = '';
    for (const [key, g] of groups) {
      html += `<h2>${esc(g.label)}${g.label !== key ? ` <span class="age">${esc(key)}</span>` : ''}</h2><table>${g.rows.map(r => row(r, now)).join('')}</table>`;
    }
    $('#groups').innerHTML = html || '<div class="empty">Keine Sessions.</div>';
    const c = {};
    for (const s of state.sessions) c[s.status] = (c[s.status] || 0) + 1;
    $('#counts').innerHTML = Object.entries(c).map(([k, v]) => `<span><span class="dot ${esc(k)}"></span>${v} ${esc(k)}</span>`).join('');
    const errs = state.errors && state.errors.length ? ` · <span class="err">${esc(state.errors.length)} Register-Fehler</span>` : '';
    $('#meta').innerHTML = `${new Date(state.generatedAt).toLocaleTimeString('de-DE')}${errs}`;
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const text = await res.text();
      if (text !== lastJson) { lastJson = text; render(JSON.parse(text)); }
    } catch (e) {
      $('#meta').innerHTML = `<span class="err">Server nicht erreichbar</span>`;
    }
  }

  // Minimales Markdown: Überschriften, Listen, Codeblöcke, Absätze, Inline-Code/Bold
  function md(src) {
    const lines = src.split('\n');
    let out = '', inCode = false, list = null;
    const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
    const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (const raw of lines) {
      if (raw.startsWith('```')) { closeList(); inCode = !inCode; out += inCode ? '<pre>' : '</pre>'; continue; }
      if (inCode) { out += esc(raw) + '\n'; continue; }
      const h = /^(#{1,3})\s+(.*)$/.exec(raw);
      if (h) { closeList(); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
      const ul = /^\s*[-*]\s+(.*)$/.exec(raw);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(raw);
      if (ul || ol) {
        const tag = ul ? 'ul' : 'ol';
        if (list !== tag) { closeList(); list = tag; out += `<${tag}>`; }
        out += `<li>${inline((ul || ol)[1])}</li>`; continue;
      }
      if (!raw.trim()) { closeList(); continue; }
      if (raw === '---') { closeList(); out += '<hr>'; continue; }
      closeList(); out += `<p>${inline(raw)}</p>`;
    }
    closeList();
    return out;
  }

  const sideHead = name => `<div class="head"><b>${esc(name)}</b><button data-close>schließen</button></div>`;

  async function openHandover(name) {
    const side = $('#side');
    side.hidden = false;
    $('#main').classList.add('with-side');
    side.innerHTML = `${sideHead(name)}<div class="empty">Lade…</div>`;
    try {
      const res = await fetch(`/api/handover/${encodeURIComponent(name)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      side.innerHTML = `${sideHead(name)}${md(await res.text())}`;
    } catch (e) {
      side.innerHTML = `${sideHead(name)}<div class="empty">Kein Handover (${esc(e.message)})</div>`;
    }
  }

  document.addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    if (open) return openHandover(open.dataset.open);
    if (e.target.closest('[data-close]')) {
      $('#side').hidden = true; $('#main').classList.remove('with-side'); return;
    }
    const txt = e.target.closest('.txt');
    if (txt) {
      const n = txt.dataset.name;
      expanded.has(n) ? expanded.delete(n) : expanded.add(n);
      txt.classList.toggle('open');
    }
  });

  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
