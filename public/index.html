<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f5;
    --card: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #3d3d3d;
    --muted: #8c8c8c;
    --hair: #e6e6e4;
    --hair-2: #cfcfcc;
    --soft: #efefed;

    --need: #e5341f;
    --block: #f08c00;
    --busy: #12a150;
    --wait: #8b5cf6;
    --idle: #b4b4b0;
    --shell: #2f6fed;
    --off: #d4d4d0;

    --sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --card: #141414; --ink: #f5f5f4; --ink-2: #c9c9c6; --muted: #7d7d79;
      --hair: #242423; --hair-2: #3a3a38; --soft: #1d1d1c;
      --idle: #5c5c59; --off: #333331;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }

  /* ═════════ Header ═════════ */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--ink); }
  .row { display: flex; align-items: center; gap: 20px; padding: 0 28px; }
  .row.main { height: 64px; }
  .row.proj { height: 46px; border-top: 1px solid var(--hair); gap: 6px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
  .grow { flex: 1; }

  /* Status-Umschalter: ein Segment-Band */
  .seg { display: flex; border: 1px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px;
                padding: 7px 14px; font-size: 14px; font-weight: 600; border-left: 1px solid var(--ink); }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: var(--soft); }
  .seg button .n { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 1ch; }
  .seg button .d { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .seg button.on { background: var(--ink); color: var(--card); }
  .seg button.alarm { background: var(--need); color: #fff; }
  .seg button.alarm .d { background: #fff; }
  .seg button.alarm.on { box-shadow: inset 0 0 0 3px var(--ink); }

  .search { position: relative; }
  .search input { font: inherit; font-size: 14px; width: 280px; height: 36px; padding: 0 34px 0 34px;
                  border: 1px solid var(--hair-2); border-radius: 10px; background: var(--card); color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--ink); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 11px var(--mono);
                color: var(--muted); border: 1px solid var(--hair-2); border-radius: 4px; padding: 0 5px; }
  .clock { font: 500 12px var(--mono); color: var(--muted); min-width: 60px; text-align: right; }
  .clock.err { color: var(--need); }

  .proj .lbl-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 8px; }
  .pbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px;
          border-radius: 8px; font-size: 14px; font-weight: 600; }
  .pbtn:hover { background: var(--soft); }
  .pbtn .c { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .pbtn.off { color: var(--muted); }
  .pbtn.off .tok { background: var(--soft) !important; color: var(--muted); }
  .pbtn.off .name { text-decoration: line-through; }
  .txtbtn { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); padding: 5px 8px; border-radius: 8px; }
  .txtbtn:hover { color: var(--ink); background: var(--soft); }
  .txtbtn.on { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* Projekt-Kürzel: die Identitätsfarbe */
  .tok { display: inline-grid; place-items: center; flex: none; height: 22px; min-width: 22px; padding: 0 5px;
         border-radius: 6px; background: var(--p); color: #fff; font: 700 11px/1 var(--mono); letter-spacing: .02em; text-transform: uppercase; }
  .tok.lg { height: 30px; min-width: 30px; border-radius: 8px; font-size: 12px; padding: 0 7px; }

  /* ═════════ Fläche ═════════ */
  main { display: grid; grid-template-columns: minmax(0, 1fr); }
  main.with-side { grid-template-columns: minmax(0, 1fr) minmax(400px, 36%); }
  #board { padding: 10px 28px 80px; }

  section { margin-top: 28px; }
  section > h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
                 font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  section > h2 .d { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  section > h2 .n { font: 600 12px var(--mono); color: var(--muted); letter-spacing: 0; }
  section > h2::after { content: ""; flex: 1; height: 1px; background: var(--hair-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); gap: 16px; align-items: stretch; }
  .grid > .tile { height: 100%; }

  /* ═════════ Karte ═════════ */
  .tile { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
          background: var(--card); border: 1px solid var(--hair); border-radius: 12px; cursor: pointer;
          transition: border-color .15s, box-shadow .15s, transform .15s; }
  .tile:hover { border-color: var(--ink); }
  .tile.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .tile.s-need  { background: color-mix(in srgb, var(--need) 7%, var(--card)); }
  .tile.s-block { background: color-mix(in srgb, var(--block) 8%, var(--card)); }
  .tile.s-off { opacity: .5; }

  .t-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
  .t-name { font: 700 19px/1.2 var(--mono); letter-spacing: -.02em; white-space: nowrap; }
  .t-tag { font: 800 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px;
           border-radius: 5px; border: 1.5px solid var(--ink); }
  .t-tag.bg { border-color: var(--block); color: var(--block); }
  .t-sub { padding: 3px 18px 0 58px; font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; min-width: 0; }
  .t-sub .br { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 1px; }

  .pill { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px;
          border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .pill .d { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill .t { font-weight: 500; opacity: .8; font-variant-numeric: tabular-nums; }
  .pill.solid { background: var(--c); color: #fff; }
  .pill.soft { background: var(--soft); color: var(--ink-2); }
  .pill.soft .d { background: var(--c); }
  .s-busy .pill .d { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .t-alert { margin: 12px 18px 0; padding: 9px 12px; border-radius: 8px; display: flex; align-items: center; gap: 9px;
             background: var(--c); color: #fff; font-size: 14px; font-weight: 700; }

  .t-body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
         margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
  .st { font-size: 10px; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--hair-2); color: var(--ink-2); }
  .st.blocked { border-color: var(--block); color: var(--block); }
  .st.done { border-color: var(--busy); color: var(--busy); }
  .st.waiting { border-color: var(--wait); color: var(--wait); }
  .st.handover { border-color: var(--ink); color: var(--ink); }
  .task { font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -.005em; overflow-wrap: anywhere; }
  .task.none { color: var(--muted); font-weight: 400; font-style: italic; font-size: 14px; }
  .last { font-size: 14px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .last.none { color: var(--muted); font-style: italic; }

  .t-foot { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--hair);
            font-size: 13px; color: var(--muted); }
  .t-foot .sp { flex: 1; }
  .t-foot .ho { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600;
                border: 1px solid var(--hair-2); border-radius: 8px; padding: 4px 10px; background: var(--card); cursor: pointer; }
  .t-foot .ho:hover { border-color: var(--ink); }
  .t-foot .jump { color: var(--ink-2); font-weight: 600; opacity: 0; transition: opacity .15s; }
  .tile:hover .t-foot .jump { opacity: 1; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 20;
           background: var(--ink); color: var(--card); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 10px;
           transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--need); color: #fff; }
  .t-foot .err { color: var(--need); font-weight: 600; }

  .empty { color: var(--muted); padding: 70px 0; text-align: center; font-size: 16px; }
  .hidden-note { color: var(--muted); font-size: 13px; margin-top: 28px; text-align: center; }

  .intro .tile { animation: rise .4s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 25ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .intro .tile, .s-busy .pill .d { animation: none; } }

  /* ═════════ Seitenleiste ═════════ */
  aside { border-left: 1px solid var(--ink); background: var(--card); min-width: 0;
          position: sticky; top: var(--hh, 111px); height: calc(100vh - var(--hh, 111px)); overflow: auto; }
  .s-head { position: sticky; top: 0; z-index: 1; background: var(--card); border-bottom: 1px solid var(--hair); }
  .s-head .t-head { padding: 16px 22px 0; }
  .s-head .t-sub { padding: 3px 22px 14px 62px; }
  .s-close { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); margin-left: 4px; }
  .s-close:hover { background: var(--soft); color: var(--ink); }
  .s-body { padding: 4px 22px 60px; }
  .s-body .t-alert { margin: 18px 0 0; }
  .s-body .s-block { margin-top: 22px; }
  .s-body .s-block > .lbl { margin-bottom: 8px; }
  .quote { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.6; color: var(--ink-2);
           border-left: 3px solid var(--ink); padding: 2px 0 2px 14px; }
  .md { font-size: 15px; line-height: 1.65; color: var(--ink-2); }
  .md h1 { font-size: 19px; color: var(--ink); margin: 4px 0 10px; letter-spacing: -.01em; }
  .md h2 { font-size: 16px; color: var(--ink); margin: 22px 0 6px; }
  .md h3 { font-size: 14px; color: var(--ink); margin: 16px 0 4px; }
  .md p { margin: 6px 0; overflow-wrap: anywhere; }
  .md ul, .md ol { padding-left: 20px; margin: 6px 0; }
  .md li { margin: 3px 0; overflow-wrap: anywhere; }
  .md code { font: 12.5px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  .md pre { font: 12.5px/1.5 var(--mono); background: var(--soft); padding: 12px; border-radius: 8px; overflow: auto; }
  .md pre code { background: none; padding: 0; }

  @media (max-width: 960px) {
    .row { padding: 0 16px; }
    .row.main { height: auto; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; gap: 12px; }
    .row.proj { height: auto; padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
    .search input { width: 100%; }
    .search { flex: 1 1 100%; }
    #board { padding: 4px 16px 60px; }
    .grid { grid-template-columns: 1fr; }
    main.with-side { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0; height: 100vh; z-index: 10; border: 0; }
  }
</style>
</head>
<body>
<header class="top" id="hdr">
  <div class="row main">
    <h1>Sessions</h1>
    <nav class="seg" id="seg"></nav>
    <div class="grow"></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Session, Aufgabe, Branch…" autocomplete="off"><kbd>/</kbd></label>
    <span class="clock" id="clock">…</span>
  </div>
  <div class="row proj" id="projects"></div>
</header>
<main id="main">
  <div id="board" class="intro"><div class="empty">Lade…</div></div>
  <aside id="side" hidden></aside>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const ICON = {
    alert: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    doc: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  };

  // ---------- Filter (pro Browser gemerkt) ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('hive-filter')) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem('hive-filter', JSON.stringify(v)); } catch {} },
  };
  const f = Object.assign({ hidden: [], q: '', offline: false, only: null }, store.get());
  delete f.onlyNeed;
  const save = () => store.set(f);
  $('#q').value = f.q;

  let state = null, lastJson = '', selected = null, firstPaint = true, lastPaint = 0;

  // ---------- Projektfarben (Identität) ----------
  // Kräftige Töne, bewusst ohne Rot/Orange/Grün, damit sie nie wie ein Status aussehen.
  const PALETTE = ['#2f6fed', '#8b3dff', '#e0319a', '#0a9fb5', '#1b1b1b', '#6d4aff', '#c026d3', '#0f766e', '#4f46e5', '#7c5c3b'];
  let colorOf = new Map();
  const pcolor = g => colorOf.get(g) || '#1b1b1b';
  const abbr = (s) => {
    const i = s.name.indexOf('.');
    if (i > 0) return s.name.slice(0, i);
    const p = (s.project || s.group || '?').replace(/[^A-Za-z0-9]/g, '');
    return p.slice(0, 2);
  };

  // ---------- Einordnung ----------
  function classify(s) {
    if (s.status === 'offline') return { rank: 3, cls: 'off', label: 'offline', c: 'var(--off)', solid: false };
    if (s.status === 'waiting') return { rank: 0, cls: 'need', label: 'wartet auf dich', c: 'var(--need)', solid: true, why: s.waitingFor || 'Eingabe nötig' };
    if (s.task && s.task.state === 'blocked') return { rank: 0, cls: 'block', label: 'blockiert', c: 'var(--block)', solid: true, why: 'Blockiert – braucht eine Entscheidung' };
    if (s.status === 'busy') return { rank: 1, cls: 'busy', label: 'arbeitet', c: 'var(--busy)', solid: true };
    // fertig, wartet auf Rückmeldung von Menschen: braucht dich nicht direkt, steht aber vorn unter „Bereit“
    if (s.task && s.task.state === 'waiting') return { rank: 2, cls: 'wait', label: 'wartet auf Rückmeldung', c: 'var(--wait)', solid: true };
    if (s.status === 'shell') return { rank: 2, cls: 'shell', label: 'Shell', c: 'var(--shell)', solid: false };
    return { rank: 2, cls: 'idle', label: 'bereit', c: 'var(--idle)', solid: false };
  }
  const SECTIONS = [
    { rank: 0, title: 'Braucht dich', c: 'var(--need)' },
    { rank: 1, title: 'Arbeitet', c: 'var(--busy)' },
    { rank: 2, title: 'Bereit', c: 'var(--idle)' },
    { rank: 3, title: 'Offline', c: 'var(--off)' },
  ];
  const STATE_DE = { working: 'in Arbeit', blocked: 'blockiert', waiting: 'wartet', done: 'erledigt', handover: 'übergeben' };

  function groupLabels(sessions) {
    const m = new Map();
    for (const s of sessions) {
      if (!m.has(s.group)) m.set(s.group, s.project || s.group);
      if (s.isPm && s.project) m.set(s.group, s.project);
    }
    return m;
  }
  function dur(iso, now) {
    if (!iso) return '';
    const s = Math.max(0, (now - Date.parse(iso)) / 1000);
    if (s < 60) return '<1 min';
    if (s < 3600) return `${Math.round(s / 60)} min`;
    if (s < 86400) return `${Math.round(s / 3600)} h`;
    return `${Math.round(s / 86400)} d`;
  }
  const ago = (iso, now) => { const d = dur(iso, now); return d ? (d === '<1 min' ? 'gerade eben' : `vor ${d}`) : ''; };

  function visible(s, k) {
    if (f.hidden.includes(s.group)) return false;
    if (k.rank === 3 && !f.offline) return false;
    if (f.only !== null && k.rank !== f.only) return false;
    if (f.q) {
      const hay = [s.name, s.project, s.task?.text, s.lastAssistant?.text, s.branch].join(' ').toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }

  // ---------- Bausteine ----------
  function head(s, k, labels, now, extra = '') {
    return `<div class="t-head">
        <span class="tok lg" style="--p:${pcolor(s.group)}">${esc(abbr(s))}</span>
        <span class="t-name">${esc(s.name)}</span>
        ${s.isPm ? '<span class="t-tag">PM</span>' : ''}
        ${s.kind === 'bg' ? `<span class="t-tag bg" title="Hintergrund-Session ohne Fenster, PID ${esc(s.pid)}">bg</span>` : ''}
        ${pill(s, k, now)}${extra}
      </div>
      <div class="t-sub"><span>${esc(labels.get(s.group) || s.group)}</span>${s.branch && s.branch !== 'HEAD' ? `<span>·</span><span class="br">${esc(s.branch)}</span>` : ''}</div>`;
  }
  function pill(s, k, now) {
    const d = s.alive ? dur(s.statusUpdatedAt, now) : '';
    return `<span class="pill ${k.solid ? 'solid' : 'soft'}" style="--c:${k.c}"><span class="d"></span>${esc(k.label)}${d ? `<span class="t">${esc(d)}</span>` : ''}</span>`;
  }
  function taskBlock(s) {
    if (!s.task) return `<div><div class="lbl">Aufgabe</div><div class="task none">noch keine Aufgaben-Zeile</div></div>`;
    const st = s.task.state || '';
    const old = s.task.stale ? '<span class="st" title="Aufgaben-Zeile seit über 60 min nicht aktualisiert">älter als 1 h</span>' : '';
    return `<div><div class="lbl">Aufgabe${st ? `<span class="st ${esc(st)}">${esc(STATE_DE[st] || st)}</span>` : ''}${old}</div><div class="task">${esc(s.task.text)}</div></div>`;
  }
  const canJump = s => s.alive && s.pid && s.kind !== 'bg';

  let toastTimer;
  function toast(msg, bad) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.toggle('bad', !!bad); el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), bad ? 4000 : 1600);
  }
  async function jump(s) {
    try {
      const res = await fetch(`/api/focus/${s.pid}`, { method: 'POST' });
      const r = await res.json().catch(() => ({}));
      if (res.ok) toast(`→ ${s.name} in iTerm`);
      else toast(`${s.name}: ${r.reason || 'Springen nicht möglich'}`, true);
    } catch { toast('Server nicht erreichbar', true); }
  }

  function tile(s, k, labels, now, i) {
    const lastText = s.lastAssistant ? s.lastAssistant.text : '';
    const last = s.alive ? `<div><div class="lbl">Zuletzt</div><div class="last${lastText ? '' : ' none'}">${esc(lastText || 'keine Antwort im sichtbaren Verlauf')}</div></div>` : '';
    const when = s.lastAssistant?.at || s.task?.updatedAt;
    const errs = s.errors && s.errors.length ? `<span class="err" title="${esc(s.errors.join(' · '))}">Lesefehler</span>` : '';
    return `<article class="tile s-${k.cls}${selected === s.name ? ' sel' : ''}" data-open="${esc(s.name)}" title="${canJump(s) ? 'Klick: zur Session in iTerm springen' : 'Klick: Details'}" style="--i:${i};--c:${k.c}">
      ${head(s, k, labels, now)}
      ${k.why ? `<div class="t-alert">${ICON.alert}${esc(k.why)}</div>` : ''}
      <div class="t-body">${taskBlock(s)}${last}</div>
      <div class="t-foot"><span>${when ? esc('letzte Antwort ' + ago(when, now)) : ''}</span><span class="sp"></span>${errs}
        ${canJump(s) ? '<span class="jump">↗ iTerm</span>' : ''}
        <button class="ho" data-details="${esc(s.name)}">${ICON.doc}${s.hasHandover ? 'Handover' : 'Details'}</button></div>
    </article>`;
  }

  // ---------- Header ----------
  function renderHeader(all, labels) {
    const n = r => all.filter(x => x.k.rank === r).length;
    const live = all.filter(x => x.k.rank !== 3).length;
    const need = n(0);
    const segs = [
      [null, 'Alle', live, null],
      [0, 'Braucht dich', need, 'var(--need)'],
      [1, 'Arbeitet', n(1), 'var(--busy)'],
      [2, 'Bereit', n(2), 'var(--idle)'],
    ];
    $('#seg').innerHTML = segs.map(([r, l, v, c]) =>
      `<button data-only="${r === null ? '' : r}" class="${f.only === r ? 'on' : ''}${r === 0 && v ? ' alarm' : ''}" ${c ? `style="--c:${c}"` : ''}>
         ${c ? '<span class="d"></span>' : ''}${l}<span class="n">${v}</span></button>`).join('');
    document.title = need ? `(${need}) Sessions` : 'Sessions';

    const counts = new Map();
    for (const x of all) if (x.k.rank !== 3 || f.offline) counts.set(x.s.group, (counts.get(x.s.group) || 0) + 1);
    const offCount = n(3);
    const sample = new Map(all.map(x => [x.s.group, x.s]));
    const items = [...labels].sort((a, b) => a[1].localeCompare(b[1])).map(([key, lbl]) =>
      `<button class="pbtn${f.hidden.includes(key) ? ' off' : ''}" data-proj="${esc(key)}" title="Klick: ein/aus · Alt-Klick: nur dieses">
         <span class="tok" style="--p:${pcolor(key)}">${esc(abbr(sample.get(key)))}</span><span class="name">${esc(lbl)}</span><span class="c">${counts.get(key) || 0}</span></button>`).join('');
    $('#projects').innerHTML = `<span class="lbl-h">Projekte</span>${items}<span class="grow"></span>
      ${offCount ? `<button class="txtbtn${f.offline ? ' on' : ''}" data-toggle="offline">${offCount} offline ${f.offline ? 'ausblenden' : 'zeigen'}</button>` : ''}
      ${f.hidden.length || f.q || f.only !== null ? '<button class="txtbtn" data-reset>Filter zurücksetzen</button>' : ''}`;

    const errs = state.errors && state.errors.length;
    const clock = $('#clock');
    clock.className = 'clock' + (errs ? ' err' : '');
    clock.textContent = new Date(state.generatedAt).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    clock.title = errs ? `${errs} Register-Fehler` : 'letzte Aktualisierung';
  }

  // ---------- Rendern ----------
  function render() {
    if (!state) return;
    const now = Date.now();
    const labels = groupLabels(state.sessions);
    colorOf = new Map([...labels.keys()].sort().map((k, i) => [k, PALETTE[i % PALETTE.length]]));
    const all = state.sessions.map(s => ({ s, k: classify(s) }));
    renderHeader(all, labels);

    const shown = all.filter(x => visible(x.s, x.k));
    let html = '', i = 0;
    for (const sec of SECTIONS) {
      const items = shown.filter(x => x.k.rank === sec.rank);
      if (!items.length) continue;
      items.sort((a, b) => sec.rank === 0
        ? (Date.parse(a.s.statusUpdatedAt || 0) - Date.parse(b.s.statusUpdatedAt || 0))
        : ((b.k.cls === 'wait') - (a.k.cls === 'wait') || (labels.get(a.s.group) || '').localeCompare(labels.get(b.s.group) || '') || (b.s.isPm - a.s.isPm) || a.s.name.localeCompare(b.s.name)));
      html += `<section><h2 style="--c:${sec.c}"><span class="d"></span>${sec.title}<span class="n">${items.length}</span></h2>
        <div class="grid">${items.map(x => tile(x.s, x.k, labels, now, i++)).join('')}</div></section>`;
    }
    const hidden = all.length - shown.length;
    if (!html) html = '<div class="empty">Keine Session passt zu den Filtern.</div>';
    if (hidden) html += `<div class="hidden-note">${hidden} ausgeblendet</div>`;
    const board = $('#board');
    board.innerHTML = html;
    if (firstPaint) { firstPaint = false; setTimeout(() => board.classList.remove('intro'), 1200); }
    document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px');
    if (selected) refreshSide();
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const text = await res.text();
      if (text !== lastJson) { lastJson = text; state = JSON.parse(text); render(); lastPaint = Date.now(); }
      else if (state && Date.now() - lastPaint > 30000) { render(); lastPaint = Date.now(); }  // Dauern weiterzählen
    } catch {
      const c = $('#clock'); c.className = 'clock err'; c.textContent = 'offline'; c.title = 'Server nicht erreichbar';
    }
  }

  // ---------- Seitenleiste ----------
  function md(src) {
    const lines = src.split('\n');
    let out = '', inCode = false, list = null, fm = lines[0] === '---';
    const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
    const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (let i = fm ? 1 : 0; i < lines.length; i++) {
      const raw = lines[i];
      if (fm) { if (raw === '---') fm = false; continue; }
      if (raw.startsWith('```')) { closeList(); inCode = !inCode; out += inCode ? '<pre><code>' : '</code></pre>'; continue; }
      if (inCode) { out += esc(raw) + '\n'; continue; }
      const h = /^(#{1,3})\s+(.*)$/.exec(raw);
      if (h) { closeList(); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
      const ul = /^\s*[-*]\s+(.*)$/.exec(raw), ol = /^\s*\d+[.)]\s+(.*)$/.exec(raw);
      if (ul || ol) {
        const tag = ul ? 'ul' : 'ol';
        if (list !== tag) { closeList(); list = tag; out += `<${tag}>`; }
        out += `<li>${inline((ul || ol)[1])}</li>`; continue;
      }
      if (!raw.trim()) { closeList(); continue; }
      closeList(); out += `<p>${inline(raw)}</p>`;
    }
    closeList();
    return out;
  }

  let sideHandover = '';
  function sideHtml(s) {
    const labels = groupLabels(state.sessions), k = classify(s), now = Date.now();
    const meta = [s.cwd, s.pid ? `PID ${s.pid}` : ''].filter(Boolean).join(' · ');
    return `<div class="s-head" style="--c:${k.c}">
        ${head(s, k, labels, now, `<button class="s-close" data-close title="Schließen (Esc)">${ICON.close}</button>`)}</div>
      <div class="s-body" style="--c:${k.c}">
        ${k.why ? `<div class="t-alert">${ICON.alert}${esc(k.why)}</div>` : ''}
        <div class="s-block">${taskBlock(s)}</div>
        ${s.lastUser ? `<div class="s-block"><div class="lbl">Letzter Prompt · ${esc(ago(s.lastUser.at, now))}</div><div class="quote">${esc(s.lastUser.text)}</div></div>` : ''}
        ${s.lastAssistant ? `<div class="s-block"><div class="lbl">Letzte Antwort · ${esc(ago(s.lastAssistant.at, now))}</div><div class="quote">${esc(s.lastAssistant.text)}</div></div>` : ''}
        <div class="s-block"><div class="lbl">Handover</div><div class="md">${sideHandover}</div></div>
        ${meta ? `<div class="s-block"><div class="lbl">Prozess</div><div class="mono" style="font-size:12px;color:var(--muted);overflow-wrap:anywhere">${esc(meta)}</div></div>` : ''}
      </div>`;
  }
  function refreshSide() {
    const s = state.sessions.find(x => x.name === selected);
    if (!s) return;
    const side = $('#side'), top = side.scrollTop;
    side.innerHTML = sideHtml(s); side.scrollTop = top;
  }
  async function openSide(name) {
    const s = state && state.sessions.find(x => x.name === name);
    if (!s) return;
    selected = name;
    sideHandover = s.hasHandover ? '<span style="color:var(--muted)">Lade…</span>' : '<span style="color:var(--muted);font-style:italic">Noch kein Handover.</span>';
    const side = $('#side');
    side.hidden = false; side.scrollTop = 0;
    $('#main').classList.add('with-side');
    render();
    if (s.hasHandover) {
      try {
        const res = await fetch(`/api/handover/${encodeURIComponent(name)}`, { cache: 'no-store' });
        sideHandover = res.ok ? md(await res.text()) : '<span style="color:var(--muted)">Nicht lesbar.</span>';
      } catch { sideHandover = '<span style="color:var(--muted)">Nicht lesbar.</span>'; }
      if (selected === name) refreshSide();
    }
  }
  function closeSide() { selected = null; $('#side').hidden = true; $('#main').classList.remove('with-side'); render(); }

  // ---------- Ereignisse ----------
  document.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-close]')) return closeSide();
    const o = t.closest('[data-only]');
    if (o) { const r = o.dataset.only === '' ? null : Number(o.dataset.only); f.only = f.only === r ? null : r; save(); return render(); }
    const p = t.closest('[data-proj]');
    if (p) {
      const k = p.dataset.proj, keys = [...groupLabels(state.sessions).keys()];
      if (e.altKey) f.hidden = (f.hidden.length === keys.length - 1 && !f.hidden.includes(k)) ? [] : keys.filter(x => x !== k);
      else f.hidden = f.hidden.includes(k) ? f.hidden.filter(x => x !== k) : [...f.hidden, k];
      save(); return render();
    }
    const tg = t.closest('[data-toggle]');
    if (tg) { f[tg.dataset.toggle] = !f[tg.dataset.toggle]; save(); return render(); }
    if (t.closest('[data-reset]')) { f.hidden = []; f.q = ''; f.only = null; $('#q').value = ''; save(); return render(); }
    const det = t.closest('[data-details]');
    if (det) return selected === det.dataset.details ? closeSide() : openSide(det.dataset.details);
    const tile = t.closest('[data-open]');
    if (tile && !window.getSelection().toString()) {
      const s = state.sessions.find(x => x.name === tile.dataset.open);
      if (s && canJump(s)) return jump(s);
      return selected === tile.dataset.open ? closeSide() : openSide(tile.dataset.open);
    }
  });
  $('#q').addEventListener('input', e => { f.q = e.target.value; save(); render(); });
  document.addEventListener('keydown', e => {
    const inQ = document.activeElement && document.activeElement.id === 'q';
    if (e.key === '/' && !inQ) { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape') { if (inQ) document.activeElement.blur(); else if (selected) closeSide(); }
  });

  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
